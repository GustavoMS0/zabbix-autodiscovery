[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zabbix-autodiscovery"
dynamic = ["version"]
description = "Discover network devices (switches, APs, firewalls, printers, servers, UPS...) and onboard them into Zabbix with the right template, with optional Grafana dashboards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "zabbix-autodiscovery contributors" }]
keywords = ["zabbix", "grafana", "network-discovery", "snmp", "monitoring", "inventory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "pysnmp>=7.1,<8",
  "PyYAML>=6.0",
  "requests>=2.31",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
zabbix-autodiscovery = "zabbix_autodiscovery.cli:main"

[project.urls]
Homepage = "https://github.com/GustavoMS0/zabbix-autodiscovery"
Issues = "https://github.com/GustavoMS0/zabbix-autodiscovery/issues"

[tool.setuptools.dynamic]
version = { attr = "zabbix_autodiscovery.__version__" }

[tool.setuptools.package-data]
zabbix_autodiscovery = ["data/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B006", "B023", "B904"]   # B904: SystemExit messages intentionally hide the traceback

[tool.pytest.ini_options]
testpaths = ["tests"]
