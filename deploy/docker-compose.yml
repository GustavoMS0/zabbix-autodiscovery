# Optional deployment for zabbix-autodiscovery. Pick what you need with profiles:
#   docker compose --profile zabbix --profile grafana up -d   # new Zabbix + Grafana
#   docker compose --profile zabbix up -d                     # new Zabbix only
#   docker compose --profile grafana up -d                    # Grafana for an existing Zabbix (set ZABBIX_API_URL)
# Copy .env.example to .env first and change every password (compose refuses to start without them).
# The zabbix-web container also loads the NOC map controls module (zoom/pan on native maps) from
# ./zabbix-modules: enable it once in Administration > General > Modules (or let `zabbix-autodiscovery maps`
# enable it on Zabbix 7.0+).

services:
  postgres:
    image: postgres:17-alpine
    profiles: [zabbix]
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZABBIX_TAG:?set ZABBIX_TAG in deploy/.env}
    profiles: [zabbix]
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      ZBX_STARTDISCOVERERS: 5
      ZBX_STARTPINGERS: 5
      ZBX_STARTPOLLERS: 20
      ZBX_STARTPOLLERSUNREACHABLE: 5
      ZBX_CACHESIZE: 256M
      ZBX_TIMEOUT: 10
    ports:
      - "10051:10051"

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_TAG:?set ZABBIX_TAG in deploy/.env}
    profiles: [zabbix]
    restart: unless-stopped
    depends_on: [postgres, zabbix-server]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      PHP_TZ: ${TZ}
      # PHP memory_limit of the frontend (image default 128M): large dashboards/maps and Grafana API
      # calls (item.get/history.get over many hosts) can exhaust the default
      ZBX_MEMORYLIMIT: 512M
    ports:
      - "8080:8080"
    volumes:
      # Zabbix frontend module: zoom, pan and "focus on problems" for the native maps (read-only mount;
      # /usr/share/zabbix/modules is the modules directory of the official zabbix-web images)
      - ./zabbix-modules/interactive_map_zoom:/usr/share/zabbix/modules/interactive_map_zoom:ro

  zabbix-agent:                     # monitors the Zabbix server itself
    image: zabbix/zabbix-agent2:${ZABBIX_TAG:?set ZABBIX_TAG in deploy/.env}
    profiles: [zabbix]
    restart: unless-stopped
    depends_on: [zabbix-server]
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: zabbix-server

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.2.0}
    profiles: [grafana]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_PLUGINS_PREINSTALL: alexanderzobnin-zabbix-app@${GRAFANA_ZABBIX_PLUGIN_VERSION:-6.9.1}
      GF_DEFAULT_INSTANCE_TIMEZONE: ${TZ}
      ZABBIX_API_URL: ${ZABBIX_API_URL}
      ZABBIX_GRAFANA_USER: ${ZABBIX_GRAFANA_USER}
      ZABBIX_GRAFANA_PASSWORD: ${ZABBIX_GRAFANA_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  pgdata:
  grafana-data:
